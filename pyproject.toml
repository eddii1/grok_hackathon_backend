[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-fleet-backend"
version = "0.1.0"
description = "Fleet command backend and hardware-free simulator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "xai-sdk>=1.21,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
hardware = ["av>=14,<19"]
mapping = ["torch>=2.6,<3", "transformers>=4.48,<5", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
