[project]
name = "fleet"
version = "0.1.0"
description = "Backend of the Grok fleet command platform: drone harness, perception, agent, API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "openai>=3.0",
    "opencv-python-headless>=4.10",
    "python-dotenv>=1.0",
]

[project.scripts]
fleet-probe = "fleet.probe:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
